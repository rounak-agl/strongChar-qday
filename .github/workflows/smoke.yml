name: smoke
# The live checkup in a real browser with the QoreX test double: real verdicts, and fixes offered then refused.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke
        env:
          SMOKE_URL: https://strongchar-qday.vercel.app
